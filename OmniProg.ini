# Descripcion de los parametros:
#[Nombre del Driver]
# com_method = Hardware de programacion (Actualmente serial o pickit5, para otro nuevo es necesario modificar la libreria omni_driver.py)
# SQTP_method = inject / file (Para otro nuevo es necesario modificar la libreria omni_firmware.py)
# path = ruta del ejecutable (debe ser del tipo linea de comandos)
# micros = Microcontroladores aceptados para este driver
# linea_comando = Aqui la construccion de la linea de comando, usando los comodines a continuacion mostrados
# returncode_ok = el numero que devuelve el programa cuando todo va bien o un texto inequivoco. (El texto debe ser en mayusculas)
# returncode_bad = el numero que devuelve el programa cuando falla la programacion o un texto inequivoco. (forzar algun error para obtener un codigo o texto)

# Para añadir otro metodo de programación aqui aparece la descripcion de las variables.
# %path (ruta del programa)
# %device (micro que aparecera en el archivo pg)
# %params (datos que aparecera en el archivo pg)
# %port (puerto que se elige en el GUI, nombre completo)
# %portn (puerto que se elige en el GUI, solo numero)
# %hex (ruta del hex que aparece en el archivo pg, o del result.hex que se genera cuando se usa la funcion SQTP, metodo = inject)
# %num (ruta del archivo que se genera cuando se usa la funcion SQTP, metodo = file)
# %program nombre del programa

# Ejemplo de archivo pg:
#Program  hex filename
#Driver   Alguno de los drivers definidos abajo
#Device   Alguno de los microcontroladores definidos para el driver
#Params   Datos que se adjuntan a la linea de comando (Velocidad del oscilador o tension de alimentacion, ver el manual del programa lanzado)
#SQTP_Dir Posicion inicial donde la numeracion SQTP va (en hexadecimal))
#SQTP_Len Tamaño maximo para la numeracion SQTP (en bytes)

[Default]
defaultprogdir = ./hexfiles
defaultsqtpdir = ./sqtpfiles

[flashmagic]
com_method = serial
SQTP_method = inject
path = C:/Program Files (x86)/Flash Magic PS/FMPS.EXE
Devices = LPC11E68,LPC4337
linea_comando = "%path" device(%device,%params) COM(%portn,115200) ERASE(DEVICE, PROTECTISP) HEXFILE("%hex", NOCHECKSUMS, NOFILL, PROTECTISP)
returncode_ok = OK
returncode_bad = FAIL

[IPECMD]
com_method = pickit5
path = '/opt/microchip/mplabx/v6.30/sys/java/zulu8.86.0.25-ca-fx-jre8.0.452-linux_x64/bin/java' '-jar' '/opt/microchip/mplabx/v6.30/mplab_platform/mplab_ipe/ipecmd.jar'
#windows path = "C:/progra~1/Microchip/MPLABX/v6.30/mplab_platform/mplab_ipe/ipecmd.exe"
Devices = PIC16F1825,PIC16F1829
linea_comando = %path -M -P%device -TS%port -F%hex -W%params
returncode_ok = Program Succeeded
returncode_bad = Operation Failed

[IPECMD_SQTP]
com_method = pickit5
SQTP_method = file
path = '/opt/microchip/mplabx/v6.30/sys/java/zulu8.86.0.25-ca-fx-jre8.0.452-linux_x64/bin/java' '-jar' '/opt/microchip/mplabx/v6.30/mplab_platform/mplab_ipe/ipecmd.jar'
#windows path = "C:/progra~1/Microchip/MPLABX/v6.30/mplab_platform/mplab_ipe/ipecmd.exe"
Devices = PIC18F4685
linea_comando = %path -M -P%device -TS%port -F"%hex" -W%params -S"%num"
returncode_ok = Program Succeeded
returncode_bad = Operation Failed
